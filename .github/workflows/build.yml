name: Build app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        run: ./gradlew :core:test

      - name: Ride real Thai mountain roads (OpenStreetMap)
        continue-on-error: true
        run: ./gradlew :core:test -PliveRoads --tests 'coach.curve.LiveRoadsTest'

      - name: Upload live road callouts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-roads
          path: core/build/live-roads/
          if-no-files-found: ignore

      # Keep the same signing key between builds, so a new build installs over the old one.
      - name: Reuse signing key
        uses: actions/cache@v4
        with:
          path: .ci/debug.keystore
          key: debug-keystore-v2

      - name: Make signing key if none was kept
        run: |
          mkdir -p .ci
          [ -f .ci/debug.keystore ] || keytool -genkeypair -keystore .ci/debug.keystore -storepass android \
            -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build app
        env:
          CI_KEYSTORE: ${{ github.workspace }}/.ci/debug.keystore
        run: ./gradlew :app:assembleDebug

      - name: Name the app file
        run: cp app/build/outputs/apk/debug/app-debug.apk curve-coach.apk

      - uses: actions/upload-artifact@v4
        with:
          name: curve-coach-apk
          path: curve-coach.apk

      - name: Publish as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest curve-coach.apk --title "Latest build (#${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Open this page on your phone and tap curve-coach.apk to install."
